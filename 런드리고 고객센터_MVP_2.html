<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>런드리고 고객센터 프로토타입</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- LaundryGo Design System — design tokens (colors, type, radius, spacing, shadow) -->
<style>
/* LDS tokens (fonts via CDN Pretendard above) */
/* ==========================================================================
   LaundryGo Design System (LDS) — Colors & Type
   Color Guide ver 2.1.0 · Typography ver 2.0.0
   KR: Pretendard · EN display: Basis Grotesque (substituted — see README)
   ========================================================================== */

/* ----- Fonts ------------------------------------------------------------- */





/* Brand display face — 런드리고딕 (LaundryGothic). Used for the wordmark
   and occasional brand-voice numerals. */



:root {
  /* === Brand / Main — Green ============================================= */
  /* The signature LaundryGo green. Action + brand-point color. */
  --green-standard: #0AC290;      /* main brand (iOS / web canonical)   */
  --green-standard-aos: #51CA97;  /* Android tint                       */
  --green-01: #CEF3E9;            /* light tint — backgrounds, chips     */
  --green-02: #07926C;            /* dark — pressed / on-light text      */
  --green-pressed: #07926C;

  /* === Secondary — Orange (witty accent) =============================== */
  --orange-standard: #FF4F17;
  --orange-standard-aos: #EC5F2F;
  --orange-01: #FFE5DC;           /* light tint                          */

  /* === Secondary — Blue ("water" identity) ============================ */
  --blue-standard: #189FFB;
  --blue-standard-aos: #5EA3F3;
  --blue-01: #CDEAFE;

  /* === InfoBlue (links / informational, all platforms) ================ */
  --info-blue: #067DFD;
  --info-blue-01: #CBE8FF;

  /* === Gray Scale (neutral UI) ========================================= */
  --black: #212121;
  --gray-800: #666666;
  --gray-700: #939393;
  --gray-500: #C9C9C9;
  --gray-400: #D9D9D9;
  --gray-300: #EFEFEF;
  --gray-200: #F5F5F5;
  --gray-100: #FAFAFA;
  --white: #FFFFFF;

  /* === Cool Gray Scale (cool neutral, visual hierarchy) =============== */
  --cool-gray-800: #4C5059;
  --cool-gray-700: #646D7A;
  --cool-gray-600: #8F97A3;
  --cool-gray-500: #B6BEC9;
  --cool-gray-400: #D3D8DF;
  --cool-gray-300: #E5E8ED;
  --cool-gray-200: #EDF0F2;
  --cool-gray-100: #F4F5F7;

  /* === Semantic =======================================================  */
  --fg-1: var(--black);        /* primary text / titles                  */
  --fg-2: var(--gray-700);     /* secondary text / descriptions          */
  --fg-3: var(--gray-500);     /* tertiary / disabled text               */
  --fg-on-color: var(--white); /* text on brand fills                    */
  --action: var(--green-standard);
  --link: var(--info-blue);
  --price: var(--green-standard);  /* discount %, prices                 */
  --bg-base: var(--white);
  --bg-subtle: var(--gray-200);    /* card backgrounds, sections         */
  --bg-field: var(--gray-100);
  --border: var(--gray-300);
  --border-strong: var(--gray-400);
  --divider: var(--gray-200);

  /* === Type families ================================================== */
  --font-kr: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-en: "Pretendard", system-ui, sans-serif; /* EN/Latin also Pretendard */
  --font-brand: "LaundryGothic", "Pretendard", sans-serif;
  --font-base: var(--font-kr);

  /* === Type scale (size / line-height) — see Typography Guide ======== */
  --h1-size: 32px;  --h1-lh: 44px;   /* 타이틀1                          */
  --h2-size: 28px;  --h2-lh: 40px;   /* 타이틀2 (회원가입)               */
  --h3-size: 24px;  --h3-lh: 32px;   /* 타이틀3                          */
  --h4-size: 20px;  --h4-lh: 28px;   /* 타이틀4 (basic)                  */
  --h5-size: 18px;  --h5-lh: 26px;   /* Appbar title · XLarge button     */
  --body1-size: 16px; --body1-lh: 24px;  /* 본문 권장                    */
  --body2-size: 14px; --body2-lh: 22px;  /* 본문 최소                    */
  --body3-size: 15px; --body3-lh: 24px;  /* 서브 버튼                    */
  --label-size: 13px; --label-lh: 20px;  /* Label                        */
  --caption1-size: 12px; --caption1-lh: 18px; /* 주석/유의 · Small btn   */
  --caption2-size: 10px; --caption2-lh: 16px; /* Tiny badge               */

  /* === Weights ======================================================== */
  --w-regular: 400;   /* @kind font */
  --w-medium: 500;    /* @kind font */
  --w-semibold: 600;  /* @kind font */
  --w-bold: 700;      /* @kind font */
  --w-extrabold: 800; /* @kind font */

  /* === Radius (corner system) ========================================= */
  --r-button: 16px;   /* primary buttons                                  */
  --r-card: 20px;     /* cards / sheets                                   */
  --r-card-sm: 12px;  /* inner cards, list items                          */
  --r-chip: 8px;      /* badges / chips                                   */
  --r-field: 12px;    /* inputs                                           */
  --r-pill: 999px;    /* full-round (CTA pill, toggles)                   */

  /* === Spacing (4px base grid) ======================================== */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --gutter: 20px;  /* mobile screen side padding                          */

  /* === Elevation / Shadow ============================================= */
  --shadow-card: 0 2px 12px rgba(33,33,33,0.06);
  --shadow-float: 0 4px 16px rgba(33,33,33,0.10);
  --shadow-cta: 0 -4px 16px rgba(33,33,33,0.06); /* bottom-fixed CTA      */
  --shadow-sheet: 0 -8px 24px rgba(33,33,33,0.12);
}

/* ----- Semantic type classes ------------------------------------------- */
.lds-h1 { font-family: var(--font-base); font-weight: var(--w-bold); font-size: var(--h1-size); line-height: var(--h1-lh); color: var(--fg-1); letter-spacing: -0.02em; }
.lds-h2 { font-family: var(--font-base); font-weight: var(--w-bold); font-size: var(--h2-size); line-height: var(--h2-lh); color: var(--fg-1); letter-spacing: -0.02em; }
.lds-h3 { font-family: var(--font-base); font-weight: var(--w-bold); font-size: var(--h3-size); line-height: var(--h3-lh); color: var(--fg-1); letter-spacing: -0.01em; }
.lds-h4 { font-family: var(--font-base); font-weight: var(--w-bold); font-size: var(--h4-size); line-height: var(--h4-lh); color: var(--fg-1); letter-spacing: -0.01em; }
.lds-h5 { font-family: var(--font-base); font-weight: var(--w-bold); font-size: var(--h5-size); line-height: var(--h5-lh); color: var(--fg-1); }
.lds-body1 { font-family: var(--font-base); font-weight: var(--w-medium); font-size: var(--body1-size); line-height: var(--body1-lh); color: var(--fg-1); }
.lds-body2 { font-family: var(--font-base); font-weight: var(--w-regular); font-size: var(--body2-size); line-height: var(--body2-lh); color: var(--fg-2); }
.lds-body3 { font-family: var(--font-base); font-weight: var(--w-semibold); font-size: var(--body3-size); line-height: var(--body3-lh); color: var(--fg-1); }
.lds-label { font-family: var(--font-base); font-weight: var(--w-medium); font-size: var(--label-size); line-height: var(--label-lh); color: var(--fg-2); }
.lds-caption1 { font-family: var(--font-base); font-weight: var(--w-medium); font-size: var(--caption1-size); line-height: var(--caption1-lh); color: var(--fg-2); }
.lds-caption2 { font-family: var(--font-base); font-weight: var(--w-bold); font-size: var(--caption2-size); line-height: var(--caption2-lh); color: var(--fg-2); }

</style>
<style>
  :root{
    /* LaundryGo Design System (LDS) tokens applied to the CS prototype */
    --green:var(--green-standard, #0AC290); --green-soft:var(--green-01, #CEF3E9); --green-press:var(--green-02, #07926C);
    --ink:var(--black, #212121); --sub:var(--cool-gray-600, #8F97A3); --tert:var(--cool-gray-500, #B6BEC9);
    --line:var(--gray-300, #EFEFEF); --card:#FFFFFF; --screen:#FFFFFF; --backdrop:var(--cool-gray-300, #E5E8ED);
    --r1:var(--orange-standard, #FF4F17); --r1b:var(--orange-01, #FFE5DC);   /* 1:1 → 오렌지 */
    --r2:var(--green-02, #07926C); --r2b:var(--green-01, #CEF3E9);   /* 기능 → 그린 */
    --r3:var(--info-blue, #067DFD); --r3b:var(--blue-01, #CDEAFE);   /* 안심케어/재분류 → 블루(세탁·물) */
    --r4:var(--cool-gray-700, #646D7A); --r4b:var(--cool-gray-100, #F4F5F7);   /* 챗봇 → 쿨그레이 */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--backdrop); color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 12px;
  }
  .wrap{display:flex; flex-direction:column; align-items:center; gap:14px}
  /* phone */
  .phone{
    width:380px; max-width:94vw; height:780px; max-height:88vh; background:var(--screen);
    border-radius:46px; box-shadow:0 24px 70px rgba(33,33,33,.28), 0 2px 8px rgba(33,33,33,.06);
    position:relative; overflow:hidden; border:1px solid rgba(0,0,0,.04);
    display:flex; flex-direction:column;
  }
  .statusbar{height:50px; display:flex; align-items:center; justify-content:space-between; padding:0 30px 0 34px; font-size:15px; font-weight:600; flex:0 0 auto}
  .statusbar .ic{display:flex; gap:6px; align-items:center}
  .statusbar svg{display:block}
  .nav{height:56px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; position:relative; border-bottom:1px solid var(--line)}
  .nav .title{font-size:18px; font-weight:600; letter-spacing:-.01em}
  .nav .back{position:absolute; left:14px; top:0; height:56px; width:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); opacity:0; pointer-events:none; transition:opacity .15s}
  .nav.has-back .back{opacity:1; pointer-events:auto}
  .body{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .pad{padding:24px 22px 28px}
  .h1{font-size:24px; font-weight:700; letter-spacing:-.01em; margin:0 0 8px; line-height:1.33}
  .lede{font-size:14px; color:var(--sub); margin:0 0 22px; line-height:1.5}
  /* category rows */
  .row{display:flex; align-items:center; gap:14px; padding:15px 2px; cursor:pointer; border-bottom:1px solid var(--line); transition:background .12s; border-radius:12px}
  .row:active{background:#F7F8FA}
  .tile{flex:0 0 auto; width:44px; height:44px; border-radius:12px; background:var(--green-soft); display:flex; align-items:center; justify-content:center}
  .tile svg{width:23px; height:23px; stroke:var(--green); fill:none; stroke-width:1.7}
  .tile.tile-c{background:var(--gray-200)}
  .tile.tile-c svg{width:34px; height:34px; stroke:none; fill:none; stroke-width:0}
  .row .meta{flex:1 1 auto; min-width:0}
  .row .nm{font-size:16px; font-weight:600; letter-spacing:-.2px; line-height:1.34; word-break:keep-all}
  .row .ex{font-size:12px; color:var(--sub); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chev{flex:0 0 auto; color:var(--tert)}
  /* sub items */
  .item{display:flex; align-items:center; gap:12px; padding:16px 4px; cursor:pointer; border-bottom:1px solid var(--line)}
  .item:active{background:#F7F8FA}
  .item .nm{font-size:15px; font-weight:600; letter-spacing:-.2px; line-height:1.4; word-break:keep-all}
  .item .nm .cond{font-weight:500; color:var(--tert); font-size:10px; margin-left:5px; letter-spacing:-.2px}
  .item .ds{font-size:12px; color:var(--sub); margin-top:4px; line-height:1.45}
  .item .right{margin-left:auto; display:flex; align-items:center; gap:9px}
  /* etc button — emphasized chatbot action */
  .etc{margin-top:24px; width:100%; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:background .12s; text-align:left}
  .etc:active{background:#F7F8FA}
  /* 중분류 페이지: 챗봇 버튼을 하단 고정 */
  .sub-pad{display:flex; flex-direction:column; min-height:100%}
  .sub-pad>.etc{margin-top:auto; position:sticky; bottom:0}
  .etc .etc-ic{width:18px; height:18px; stroke:var(--tert); fill:none; stroke-width:1.8; flex:0 0 auto}
  .etc-txt{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1}
  .etc .nm{font-size:14px; font-weight:600; color:var(--ink); letter-spacing:-.2px}
  .etc .ex{font-size:12px; font-weight:500; color:var(--sub); line-height:1.5; letter-spacing:-.2px}
  .etc-right{display:flex; align-items:center; gap:6px; flex:0 0 auto}
  /* badges (PM mode) */
  .badge{display:none; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap}
  .cnt{display:none; font-size:12px; color:var(--tert); font-weight:600; margin-left:auto}
  .b-1\.1{background:var(--r1b); color:var(--r1)}
  .b-기능{background:var(--r2b); color:var(--r2)}
  .b-안심케어{background:var(--r3b); color:var(--r3)}
  .b-품목재분류{background:var(--r3b); color:var(--r3)}
  .b-챗봇{background:var(--r4b); color:var(--r4)}
  /* priority badges (CS 우선순위) — 사용자단 비노출 */
  .pri{display:none; font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px; white-space:nowrap; letter-spacing:-.2px}
  .pri.urgent{background:#FCE3DE; color:#E5341B}
  .pri.high{background:#FFE8C9; color:#C2700A}
  .pri.normal{background:#EEF0F2; color:#8A8F98}
  /* destination screens */
  .dest{padding:24px 22px}
  .kicker{font-size:12px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; margin:0 0 10px}
  .kmethod{display:none}
  .kicker.pm-only{display:none}
  /* segmented tabs (청구 내역) */
  .tabs{display:flex; gap:6px; background:var(--cool-gray-100); border-radius:12px; padding:4px; margin:14px 0 14px}
  .tabs .tab{flex:1; padding:9px; border:none; background:none; border-radius:8px; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; font-family:inherit; letter-spacing:-.2px}
  .tabs .tab.active{background:#fff; color:var(--ink); box-shadow:var(--shadow-card)}
  .care-note{font-size:12px; color:#4A4F57; line-height:1.6; margin-top:12px}
  .care-note .ttl{font-weight:800; color:var(--ink); display:block; margin-bottom:4px}
  .care-note .rule{display:block; font-size:12px; color:var(--sub); margin-top:8px; line-height:1.5}
  .pill-ok{display:inline-block; font-size:12px; font-weight:800; color:var(--green); background:var(--green-soft); border-radius:8px; padding:2px 8px; margin-bottom:8px}
  .pill-no{display:inline-block; font-size:12px; font-weight:800; color:#C0392B; background:#FCEBEA; border-radius:8px; padding:2px 8px; margin-bottom:8px}
  .bcnt{font-weight:600; color:var(--tert); font-size:12px; margin-left:3px}
  /* 상세 내역 (맡긴 세탁물별 처리) */
  .dlist{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:6px}
  .ditem{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; border-bottom:1px solid var(--line)}
  .ditem:last-child{border-bottom:none}
  .di-nm{font-size:13px; font-weight:700; color:var(--ink)}
  .di-mode{display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:flex-end; text-align:right}
  .m-ticket{font-size:12px; font-weight:800; color:var(--green); background:var(--green-soft); border-radius:8px; padding:3px 9px}
  .m-charged{font-size:12px; font-weight:700; color:#4A4F57}
  .chip-tk{font-size:12px; font-weight:800; color:var(--green); background:var(--green-soft); border-radius:8px; padding:3px 9px}
  .chip-cg{font-size:12px; font-weight:800; color:#5A6069; background:#EEF0F2; border-radius:8px; padding:3px 9px}
  .di-val{font-size:13px; font-weight:700; color:var(--ink)}
  .m-cp{font-size:12px; font-weight:700; color:var(--green); background:var(--green-soft); border-radius:8px; padding:2px 7px}
  /* 세탁권 차감 안내 표 */
  .ttable{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:6px}
  .ttable .tr{display:flex; border-bottom:1px solid var(--line)}
  .ttable .tr:last-child{border-bottom:none}
  .ttable .th{flex:0 0 110px; background:#FAFBFC; padding:10px 12px; font-size:12px; font-weight:700; color:var(--sub)}
  .ttable .td{flex:1; padding:10px 12px; font-size:12px; color:var(--ink); font-weight:600; line-height:1.45}
  .ttable .td.warn{color:#C0392B}
  /* 세탁권 차감 안내 — 컬럼형 표 */
  .ttable3{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:6px}
  .ttable3 .t3h, .ttable3 .t3v{display:flex}
  .ttable3 .t3h{background:#FAFBFC; border-bottom:1px solid var(--line)}
  .ttable3 .t3h span, .ttable3 .t3v span{flex:1; text-align:center; padding:10px 8px}
  .ttable3 .t3h span:not(:last-child), .ttable3 .t3v span:not(:last-child){border-right:1px solid var(--line)}
  .ttable3 .t3h span{font-size:12px; font-weight:700; color:var(--sub)}
  .ttable3 .t3v span{font-size:14px; font-weight:800; color:var(--ink)}
  .t3note{margin-top:10px; padding:10px 13px; border-radius:12px; background:#FCF1F0; color:#C0392B; font-size:12px; font-weight:600; line-height:1.55}
  .reason-box{background:#FCF1F0; border:1px solid #F4D9D6; border-radius:12px; padding:13px 15px; margin-top:10px; font-size:12px; color:#4A4F57; line-height:1.65}
  .reason-box .rb-ttl{display:block; font-weight:800; color:#C0392B; font-size:12px; margin-bottom:5px}
  /* 해지 가능 조건 */
  .cond-list{display:flex; flex-direction:column; gap:8px; margin-top:6px}
  .cond-item{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-size:13px; font-weight:600; color:#3E434A}
  .cond-item .ci-ic{width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:0 0 auto; color:#fff}
  .cond-item.ok .ci-ic{background:var(--green)}
  .cond-item.no .ci-ic{background:#C0392B}
  .cond-item .ci-tag{margin-left:auto; font-size:12px; font-weight:800}
  .cond-item.ok .ci-tag{color:var(--green)}
  .cond-item.no .ci-tag{color:#C0392B}
  .verdict{display:flex; gap:9px; border-radius:12px; padding:13px 15px; margin-top:14px; font-size:12px; line-height:1.6; font-weight:600}
  .verdict .v-ic{flex:0 0 auto; font-size:15px}
  .verdict.ok{background:var(--green-soft); color:#1A7A52}
  .verdict.no{background:#FCF1F0; color:#C0392B}
  .k-1\.1{color:var(--r1)} .k-기능{color:var(--r2)} .k-안심케어{color:var(--r3)} .k-품목재분류{color:var(--r3)} .k-챗봇{color:var(--r4)}
  .dest h2{font-size:20px; font-weight:700; letter-spacing:-.01em; margin:0 0 10px; line-height:1.4}
  .dest p.guide{font-size:14px; color:#4A4F57; line-height:1.6; margin:0 0 4px}
  .infobox{background:var(--gray-200); border-radius:16px; padding:18px; margin:18px 0; font-size:14px; color:var(--cool-gray-800); line-height:1.6}
  .infobox b{color:var(--ink)}
  .cta{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:16px; border-radius:16px; border:none; font-size:16px; font-weight:700; cursor:pointer; margin-top:6px; letter-spacing:-.2px}
  .cta.primary{background:var(--green); color:#fff}
  .cta.primary:active{background:var(--green-press)}
  .cta.ghost{background:#fff; color:var(--ink); border:1.5px solid #DDE0E4}
  .cta.ghost:active{background:#F6F7F9}
  /* resolve check (기능 답변 only) — de-emphasized; 아니요는 1:1로 가는 경로라 가장 약하게 */
  .resolve{margin-top:22px; padding-top:14px; border-top:1px solid var(--line); display:flex; align-items:center; flex-wrap:wrap; gap:8px}
  .resolve .q{font-size:12px; font-weight:600; color:var(--sub); text-align:left; margin:0 8px 0 0; letter-spacing:-.2px}
  .resolve .btns{display:flex; gap:6px; align-items:center; margin-left:auto}
  .resolve button{padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; letter-spacing:-.2px; color:#5A6069}
  .resolve button:active{background:#F6F7F9}
  .resolve .yes{color:#4A4F57}
  .resolve .no{border:none; background:none; padding:7px 4px; color:var(--tert); font-weight:500; text-decoration:underline; text-underline-offset:2px}
  .resolve .no:active{background:none; color:var(--sub)}
  .resolve .no.active{color:#4A4F57; font-weight:700}
  .inquiry-cta{margin-top:14px}
  .inquiry-cta .iq-msg{font-size:12px; color:var(--sub); margin:0 2px 10px; line-height:1.55}
  .iq-textlink{color:var(--green); font-weight:700; text-decoration:underline; text-underline-offset:2px; cursor:pointer}
  .iq-btn{display:inline-flex; align-items:center; gap:5px; background:#fff; border:1px solid #DDE0E4; color:#4A4F57; border-radius:8px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; letter-spacing:-.2px}
  .iq-btn:active{background:#F6F7F9}
  /* pickup records (1:1) */
  .rec{border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; cursor:pointer}
  .rec:active{background:#F7F8FA}
  .rec.sel{border-color:var(--green); background:var(--green-soft)}
  .rec .d{font-size:14px; font-weight:800}
  .rec .l{display:flex; gap:8px; font-size:12px; color:var(--sub); margin-top:6px}
  .rec .l span:first-child{color:var(--tert); min-width:64px}
  textarea{width:100%; min-height:120px; border:1px solid var(--line); border-radius:12px; padding:14px; font-size:14px; font-family:inherit; resize:none; margin-top:6px}
  textarea:focus{outline:none; border-color:var(--green)}
  .label{font-size:13px; font-weight:800; margin:18px 0 8px}
  .label .opt{font-weight:600; color:var(--tert); font-size:12px; margin-left:4px}
  /* compact selected record + form fields (1:1) */
  .rec-mini{display:flex; align-items:center; gap:8px; flex-wrap:wrap; border:1px solid var(--line); background:#FAFBFC; border-radius:12px; padding:9px 12px; margin-top:2px}
  .rec-mini .rm-tag{font-size:10px; font-weight:800; color:var(--green); background:var(--green-soft); border-radius:8px; padding:2px 7px; letter-spacing:-.2px}
  .rec-mini .rm-d{font-size:12px; font-weight:800; color:var(--ink)}
  .rec-mini .rm-svc{font-size:12px; color:var(--sub)}
  .rm-change{margin-left:auto; font-size:12px; font-weight:700; color:var(--green); background:none; border:none; cursor:pointer; font-family:inherit; text-decoration:underline; text-underline-offset:2px; padding:2px}
  .tinput{width:100%; border:1px solid var(--line); border-radius:12px; padding:13px 14px; font-size:14px; font-family:inherit; margin-top:6px}
  .tinput:focus{outline:none; border-color:var(--green)}
  .attach{display:flex; align-items:center; justify-content:center; gap:7px; width:100%; border:1.5px dashed #CFD4DA; background:#fff; border-radius:12px; padding:13px; font-size:13px; font-weight:700; color:#5A6069; cursor:pointer; font-family:inherit; margin-top:6px}
  .attach:active{background:#F7F8FA}
  .attach svg{width:17px; height:17px; stroke:#7A828C; fill:none; stroke-width:1.8}
  .attach-list{display:flex; flex-direction:column; gap:7px}
  .attach-list:not(:empty){margin-top:8px}
  .att-item{display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:12px; padding:8px 11px; font-size:12px}
  .att-item .ai-ic{width:30px; height:30px; border-radius:8px; background:var(--green-soft); display:flex; align-items:center; justify-content:center; font-size:14px; flex:0 0 auto}
  .att-item .ai-nm{font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .att-item .ai-sz{color:var(--tert); font-size:12px; margin-left:2px; flex:0 0 auto}
  .att-item .ai-x{margin-left:auto; color:var(--tert); background:none; border:none; cursor:pointer; font-size:16px; line-height:1; padding:2px 4px; flex:0 0 auto}
  /* billing breakdown (요금·쿠폰·세탁권) */
  .bill{border:1px solid var(--line); border-radius:16px; padding:4px 16px; margin-top:6px}
  .bill .br{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:12px 0; font-size:14px; border-bottom:1px solid var(--line)}
  .bill .br:last-child{border-bottom:none}
  .bill .br .bl{color:#4A4F57}
  .bill .br .bl .bsub{display:block; font-size:12px; color:var(--tert); margin-top:2px}
  .bill .br .bv{font-weight:700; white-space:nowrap}
  .bill .br .bv .bweak{font-weight:500; color:var(--tert); font-size:12px}
  .bill .br.disc .bv{color:var(--green)}
  .bill .br.total{padding:15px 0}
  .bill .br.total .bl{font-weight:800; font-size:14px; color:var(--ink)}
  .bill .br.total .bv{font-weight:800; font-size:16px}
  .bill-note{font-size:12px; color:var(--sub); margin:9px 2px 0; line-height:1.5}
  /* 세탁물 선택 (안심케어·품목재분류) */
  .garment{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px; cursor:pointer}
  .garment:active{background:#F7F8FA}
  .garment .g-ic{width:38px; height:38px; border-radius:12px; background:var(--green-soft); display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 auto}
  .garment .g-nm{font-size:14px; font-weight:700; letter-spacing:-.2px}
  .garment .g-tag{font-size:12px; color:var(--sub); margin-top:3px}
  .garment .chev{margin-left:auto; color:var(--tert)}
  /* 세탁물 멀티 선택 (1:1 분실·누락) */
  .garment.gmulti{position:relative}
  .garment.gmulti.on{border-color:var(--green); background:var(--green-soft)}
  .garment .g-check{width:22px; height:22px; border-radius:7px; border:1.6px solid var(--gray-300); background:#fff; flex:0 0 auto; display:flex; align-items:center; justify-content:center}
  .garment.gmulti.on .g-check{background:var(--green); border-color:var(--green)}
  .garment.gmulti.on .g-check::after{content:""; width:10px; height:6px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translateY(-1px)}
  .gsel-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px}
  .gchip{font-size:12px; font-weight:600; color:var(--green-press); background:var(--green-soft); border-radius:8px; padding:5px 10px; letter-spacing:-.2px}
  /* chat */
  .chat{padding:18px 16px; display:flex; flex-direction:column; gap:10px}
  .bubble{max-width:80%; padding:12px 14px; border-radius:16px; font-size:14px; line-height:1.5}
  .bot{align-self:flex-start; background:#F1F2F4; border-bottom-left-radius:5px}
  .quick{align-self:flex-start; display:flex; flex-wrap:wrap; gap:8px; margin-top:2px}
  .quick button{background:#fff; border:1.4px solid #DDE0E4; color:var(--ink); border-radius:999px; padding:8px 13px; font-size:12px; font-weight:600; cursor:pointer}
  .quick button:active{background:#F2F3F5}
  .chatbar{flex:0 0 auto; border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:8px; align-items:center}
  .chatbar input{flex:1; border:1px solid var(--line); border-radius:999px; padding:11px 15px; font-size:14px; font-family:inherit}
  .chatbar input:focus{outline:none; border-color:var(--green)}
  /* chatbot header strip + escalate-to-agent */
  .chathead{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--line)}
  .chathead .who{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; letter-spacing:-.2px}
  .chathead .who .av{width:24px; height:24px; border-radius:50%; background:var(--r4b); display:flex; align-items:center; justify-content:center; font-size:13px}
  .agent-btn{display:inline-flex; align-items:center; gap:5px; background:#fff; border:1px solid #DDE0E4; color:#5A6069; border-radius:999px; padding:6px 11px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; letter-spacing:-.2px}
  .agent-btn:active{background:#F4F5F7}
  .agent-btn svg{width:13px; height:13px; stroke:#7A828C; fill:none; stroke-width:1.8}
  .quick button.agent{border-color:#CFC8F0; color:var(--r4); background:#fff}
  .act-card{align-self:flex-start; max-width:84%; border:1px solid var(--line); border-radius:16px; padding:12px 14px; background:#fff; font-size:13px; line-height:1.5}
  .act-card .t{font-size:12px; font-weight:800; color:var(--r2); letter-spacing:.3px; margin-bottom:6px}
  .act-card .kv{display:flex; gap:8px; margin-top:3px}
  .act-card .kv span:first-child{color:var(--tert); min-width:60px; font-size:12px}
  .act-card .kv span:last-child{font-weight:700; font-size:12px}
  /* 런드렛 비밀번호 표 (챗봇 시연) */
  .pwtab{align-self:flex-start; max-width:84%; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#fff}
  .pwtab .pr{display:flex; align-items:center; border-bottom:1px solid var(--line); font-size:13px}
  .pwtab .pr:last-child{border-bottom:none}
  .pwtab .pr.head{background:#FAFBFC}
  .pwtab .pr span{padding:9px 14px}
  .pwtab .pr span:first-child{flex:1; color:#3E434A; font-weight:600; display:flex; align-items:center; gap:8px}
  .pwtab .pr span:last-child{flex:0 0 74px; font-weight:800; color:var(--ink)}
  .pwtab .pr.head span{font-weight:700; color:var(--sub); font-size:12px}
  .pwtab .sw{width:11px; height:11px; border-radius:50%; flex:0 0 auto; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  /* handoff context card on the 1:1 form */
  .handoff{border:1px solid var(--r4b); background:var(--cool-gray-100); border-radius:16px; padding:14px 16px; margin:2px 0 18px}
  .handoff .ht{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--r4); letter-spacing:.2px; margin-bottom:10px}
  .handoff .ht svg{width:14px; height:14px; stroke:var(--r4); fill:none; stroke-width:1.9}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
  .chip{font-size:12px; font-weight:700; color:#4A4F57; background:#fff; border:1px solid #E6E2F6; border-radius:999px; padding:5px 10px}
  .handoff .sum{font-size:12px; color:#4A4F57; line-height:1.55}
  .handoff .sum b{color:var(--ink)}
  .prefill-note{font-size:12px; color:var(--sub); margin:6px 2px 0; display:flex; align-items:center; gap:5px}
  .toast{position:absolute; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px); background:#1A1C1F; color:#fff; font-size:13px; font-weight:600; padding:12px 18px; border-radius:12px; opacity:0; transition:all .25s; pointer-events:none; z-index:5; width:max-content; max-width:calc(100% - 32px); white-space:nowrap; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .home-indicator{flex:0 0 auto; height:26px; display:flex; align-items:center; justify-content:center}
  .home-indicator span{width:134px; height:5px; border-radius:3px; background:#1A1C1F}
  .footer{display:flex; align-items:center; justify-content:center; gap:18px; padding:16px 0 4px; font-size:13px; color:var(--sub); font-weight:600}
  /* 홈 화면: 푸터를 하단 고정 */
  .home-pad{display:flex; flex-direction:column; min-height:100%}
  .home-pad>.footer{margin-top:auto}
  .footer .sep{color:var(--line)}
  .footer .faq-link{cursor:pointer; transition:color .15s}
  .footer .faq-link:active{color:var(--green-press)}
  /* FAQ accordion */
  .faq{border-bottom:1px solid var(--line)}
  .faq:first-of-type{border-top:1px solid var(--line)}
  .faq-q{width:100%; display:flex; align-items:flex-start; gap:14px; justify-content:space-between; background:none; border:0; padding:18px 2px; font-family:inherit; font-size:15px; font-weight:600; letter-spacing:-.2px; color:var(--ink); text-align:left; cursor:pointer; line-height:1.45; word-break:keep-all}
  .faq-q .faq-ar{flex:0 0 auto; margin-top:3px; color:#C4C8CE; transition:transform .22s, color .15s}
  .faq.open .faq-q{color:var(--green-press)}
  .faq.open .faq-ar{transform:rotate(180deg); color:var(--green)}
  .faq-a{max-height:0; overflow:hidden; transition:max-height .28s ease}
  .faq.open .faq-a{max-height:360px}
  .faq-a p{margin:0; padding:0 2px 18px; font-size:14px; line-height:1.62; color:var(--sub); letter-spacing:-.2px; word-break:keep-all; text-wrap:pretty}
  .hint{font-size:12px; color:#9aa0a8; max-width:380px; text-align:center; line-height:1.5}
  /* ===== reference-screen design (home / chat / sheet) ===== */
  .home{padding:22px 20px 30px}
  .greet{font-size:24px; font-weight:700; letter-spacing:-.5px; line-height:1.34; margin:8px 0 18px; color:var(--ink)}
  .aibanner{width:100%; display:flex; align-items:center; gap:10px; background:linear-gradient(118deg,#0AC290 0%,#14B98C 60%,#23B083 100%); border:none; border-radius:20px; padding:16px 18px; cursor:pointer; text-align:left; box-shadow:0 8px 22px rgba(10,194,144,.30); font-family:inherit}
  .aibanner:active{filter:brightness(.97)}
  .ab-txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
  .ab-ttl{font-size:15px; font-weight:800; color:#fff; letter-spacing:-.3px; display:flex; align-items:center; gap:7px}
  .ab-beta{font-size:10px; font-weight:800; background:rgba(255,255,255,.26); color:#fff; border-radius:999px; padding:2px 8px; letter-spacing:.3px}
  .ab-chev{font-size:18px; color:#fff; opacity:.92; font-weight:600; margin-left:-2px}
  .ab-sub{font-size:12px; color:rgba(255,255,255,.92); font-weight:500; letter-spacing:-.2px}
  .ab-art{flex:0 0 auto; display:flex; align-items:center}
  .qcard{margin-top:14px; background:var(--gray-200); border-radius:20px; padding:4px 16px}
  .qrow{width:100%; display:flex; align-items:center; gap:13px; background:none; border:none; cursor:pointer; padding:14px 0; font-family:inherit; text-align:left; border-bottom:1px solid var(--cool-gray-300)}
  .qrow:last-child{border-bottom:none}
  .qrow:active{opacity:.55}
  .qrow svg{width:21px; height:21px; flex:0 0 auto}
  .qrow span{font-size:14px; font-weight:600; color:var(--ink); letter-spacing:-.3px}
  .home-sec{font-size:20px; font-weight:700; letter-spacing:-.4px; margin:30px 0 6px; color:var(--ink)}
  .home-sub{font-size:13px; color:var(--sub); line-height:1.55; margin:0 0 16px; letter-spacing:-.2px; text-wrap:pretty}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .gtile{display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:13px; background:var(--gray-200); border:none; border-radius:20px; padding:22px 12px 18px; cursor:pointer; font-family:inherit; min-height:130px}
  .gtile:active{background:var(--cool-gray-200)}
  .gic{width:52px; height:52px; display:flex; align-items:center; justify-content:center}
  .gic svg{width:52px; height:52px; display:block}
  .gnm{font-size:14px; font-weight:700; color:var(--ink); text-align:center; line-height:1.35; letter-spacing:-.3px; text-wrap:balance}
  .gtile .cnt{margin:0 auto; color:var(--tert)}
  /* chat (reference screen 3) */
  .chat-greet{margin:8px 2px 10px}
  .cg-title{font-size:24px; font-weight:700; line-height:1.34; letter-spacing:-.5px; color:var(--green); margin:0 0 10px; white-space:pre-line}
  .cg-sub{font-size:14px; line-height:1.6; color:var(--cool-gray-700); font-weight:500; margin:0; letter-spacing:-.2px; text-wrap:pretty}
  .chatfoot{flex:0 0 auto; padding:11px 16px 12px; border-top:1px solid var(--line); background:#fff}
  .send{flex:0 0 auto; width:44px; height:44px; border-radius:50%; border:none; background:var(--green); display:flex; align-items:center; justify-content:center; cursor:pointer}
  .send:active{background:var(--green-press)}
  .send svg{width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
  .chat-note{font-size:12px; color:var(--tert); text-align:center; margin:10px 6px 0; line-height:1.5; letter-spacing:-.2px}
  /* bottom sheet */
  .sheet-host{position:absolute; inset:0; z-index:8; display:none}
  .sheet-host.show{display:block}
  .sheet-bd{position:absolute; inset:0; background:rgba(20,24,31,.45); opacity:0; transition:opacity .26s}
  .sheet-host.show .sheet-bd{opacity:1}
  .sheet{position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:20px 20px 0 0; padding:10px 20px 26px; transform:translateY(101%); transition:transform .3s cubic-bezier(.32,.72,0,1); box-shadow:var(--shadow-sheet)}
  .sheet-host.show .sheet{transform:translateY(0)}
  .sheet .grab{width:40px; height:5px; border-radius:3px; background:var(--cool-gray-400); margin:6px auto 18px}
  .sheet h3{font-size:16px; font-weight:700; letter-spacing:-.3px; margin:0 0 16px; color:var(--ink)}
  .sheet-row{display:flex; gap:11px}
  .sheet-opt{flex:1; background:#fff; border:1.5px solid var(--gray-300); border-radius:16px; padding:18px 12px 16px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:11px; text-align:center; font-family:inherit}
  .sheet-opt:active{background:var(--gray-100)}
  .sheet-opt .so-ic{width:40px; height:40px; display:flex; align-items:center; justify-content:center}
  .sheet-opt .so-ttl{font-size:14px; font-weight:700; color:var(--ink); line-height:1.35; letter-spacing:-.3px}
  .sheet-opt .so-sub{font-size:12px; color:var(--tert); font-weight:500; letter-spacing:-.2px}
  .sheet-full{width:100%; margin-top:11px; background:#fff; border:1.5px solid var(--gray-300); border-radius:16px; padding:16px; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer; font-family:inherit; letter-spacing:-.2px}
  .sheet-full:active{background:var(--gray-100)}
  /* ===== 안심케어 현황 (care) ===== */
  .care-list-label{font-size:13px; color:var(--cool-gray-500, #B6BEC9); text-align:left; margin:18px 2px 10px}
  .care-banner{display:flex; align-items:center; gap:11px; background:var(--green-01,#CEF3E9); border-radius:12px; padding:14px 16px; margin-bottom:20px; cursor:pointer; transition:filter .12s}
  .care-banner:active{filter:brightness(.96)}
  .care-banner .cb-ic{flex:0 0 auto; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:19px; line-height:1}
  .care-banner .cb-tx{flex:1 1 auto; font-size:14px; font-weight:600; color:var(--ink); letter-spacing:-.2px}
  .care-banner .cb-go{flex:0 0 auto; font-size:13px; font-weight:600; color:var(--green-02,#07926C); white-space:nowrap}
  .care-sec .care-sec-t{font-size:13px; font-weight:700; color:var(--sub); margin:24px 0 10px; letter-spacing:-.2px}
  .care-card{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px; cursor:pointer; background:#fff; transition:background .12s}
  .care-card:active{background:#F7F8FA}
  .cc-thumb{flex:0 0 48px; width:48px; height:48px; border-radius:8px; background:var(--cool-gray-100,#F4F5F7); flex-shrink:0}
  .care-card .cc-meta{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:4px}
  .cc-top{display:flex; align-items:center; gap:6px; min-width:0}
  .cc-type{flex:0 0 auto; font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; white-space:nowrap; letter-spacing:-.2px; background:var(--cool-gray-100,#F4F5F7); color:var(--cool-gray-600,#8F97A3)}
  .cc-nm{font-size:15px; font-weight:700; letter-spacing:-.2px; color:var(--ink); flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cc-status{flex:0 0 auto; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap; letter-spacing:-.2px; align-self:center}
  .cc-sub{font-size:12px; color:var(--tert); letter-spacing:-.2px}
  .care-card .chev{flex:0 0 auto; color:var(--tert); margin-left:4px}
  .care-detail .cd-head{display:flex; flex-direction:column; align-items:flex-start; gap:9px; margin-bottom:18px}
  .care-detail .cd-name{font-size:20px; font-weight:700; letter-spacing:-.01em; color:var(--ink); line-height:1.4}
  .care-detail .cd-meta{font-size:13px; color:var(--sub); line-height:1.6; letter-spacing:-.2px}
  .care-detail .cd-meta b{color:var(--ink); font-weight:600}

function render(){
  const top=stack[stack.length-1];

  if(top.type==='home') el.innerHTML=renderHome();

  else if(top.type==='care_list') el.innerHTML=renderCareList();

function renderRoute(di, item, isEtc){
  const c=IA[di];
  if(isEtc){
    const e=c.etc||{};
    window._chatCtx={cat:c.nm, sub:(e.folded||'이 외 문의'), d:di, summary:''};
    const opts=e.opts?e.opts:(e.folded?optionsFor(e.folded):['이용 방법이 궁금해요','다른 문의가 있어요']);
    return chatScreen(`'${c.nm}' 관련해서 어떤 점이 궁금하신가요? 편하게 말씀해 주세요.`, opts);
  }
  const r=item.route;
  if(r==='챗봇'){
    window._chatCtx={cat:c.nm, sub:item.nm, d:di, summary:''};
    return chatScreen(`'${item.nm}' 관련 문의를 도와드릴게요. 어떤 점이 궁금하세요?`, optionsFor(item.nm));
  }
  if(r==='1:1'){const t=stack[stack.length-1]; return form1to1(item, t.step||1, t.sel, undefined, t.gsel);}
  if(r==='기능'){
    if(item.cancel) return cancelScreen(item);
    if(item.billing){const t=stack[stack.length-1]; return billingFlow(item, t.step||1, t.sel);}
    return featureScreen(item);
  }
  if(r==='안심케어'){const t=stack[stack.length-1]; return careFlow(item,'안심케어','접수',t.step||1,t.sel,t.gsel);}
  if(r==='품목재분류'){const t=stack[stack.length-1]; return careFlow(item,'품목 재분류','요청',t.step||1,t.sel,t.gsel);}
}

function optionsFor(nm){
  if(nm.includes('런드렛')) return ['런드렛 비밀번호를 모르겠어요','런드렛을 반납하고 싶어요','런드렛이 손상됐어요','런드렛 신청·전환 문의'];
  if(nm.includes('수거·배송 방법')||nm.includes('바꾸고')) return ['수거 시간을 바꾸고 싶어요','문 앞/문고리 위치를 바꾸고 싶어요','여러밤 배송으로 바꾸고 싶어요'];
  if(nm.includes('반려')) return ['왜 세탁이 반려됐나요?','반려된 세탁물은 어떻게 되나요?','환불은 어떻게 받나요?'];
  if(nm.includes('세탁 여부')||nm.includes('세탁 방법')||nm.includes('분류')) return ['이 옷 세탁할 수 있나요?','왜 프리미엄으로 분류됐나요?'];
  if(nm.includes('포인트')||nm.includes('결제수단')) return ['헌옷 포인트가 안 들어왔어요','결제수단을 바꾸고 싶어요','결제수단을 삭제하고 싶어요'];
  if(nm.includes('이용방법')) return ['서비스 이용 방법','보관 서비스','헌옷수거','회원·탈퇴','수선 신청 방법'];
  return ['자세히 알려주세요'];
}

function next1to1(){
  if(window._sel==null) return;
  const top=stack[stack.length-1];
  push({type:'route', escalated:top.escalated, ctx:top.ctx, d:top.d, item:top.item, isEtc:false, step:2, sel:window._sel});
}

function nextGarment(){
  const top=stack[stack.length-1];
  const gsel=(window._gsel||[]).slice().sort((a,b)=>a-b);
  if(window._lostFlow) window._lostFlow.gsel=gsel.slice();
  push({type:'route', escalated:top.escalated, ctx:top.ctx, d:top.d, item:top.item, isEtc:false, step:3, sel:top.sel, gsel});
}

const ATTACH_SAMPLES=[['IMG_4821.jpg','1.8MB','🖼️'],['세탁_라벨.jpg','920KB','🖼️'],['영수증.pdf','240KB','📄'],['손상부위.png','2.4MB','🖼️']];
window._attachN=0;
function appendAttRow(list, a, lf){
  const row=document.createElement('div'); row.className='att-item';
  row.innerHTML=`<span class="ai-ic">${a[2]}</span><span class="ai-nm">${a[0]}</span><span class="ai-sz">${a[1]}</span><button class="ai-x" aria-label="삭제">×</button>`;
  row.querySelector('.ai-x').onclick=()=>{ row.remove(); if(lf){ const i=lf.atts.indexOf(a); if(i>=0) lf.atts.splice(i,1); } };
  list.appendChild(row);
}
function addAttach(){
  const list=document.getElementById('attachList'); if(!list)return;
  const lf=lostActive();
  const count = lf ? lf.atts.length : list.children.length;
  if(count>=4){toast('첨부는 최대 4개까지 가능해요'); return;}
  const s=ATTACH_SAMPLES[window._attachN % ATTACH_SAMPLES.length]; window._attachN++;
  const a=[s[0],s[1],s[2]];
  if(lf) lf.atts.push(a);
  appendAttRow(list, a, lf);
}

    setTimeout(()=>addBubble('안내해 드린 번호로 열리지 않는다면, 다이얼 옆 화살표 색상에 맞춰 아래 번호를 시도해 주세요.','bot'),900);
    setTimeout(()=>addNode(pwTableHTML()),1300);
    setTimeout(()=>addBubble('위 임시 번호로도 열리지 않으면 지퍼 부분을 젓가락이나 볼펜 등 얇은 물건으로 조심스럽게 눌러 열어 주세요.','bot'),1700);
    return;
  }
  // 기본 — 주문 조회 시뮬레이션
  setTimeout(()=>addBubble('네, 바로 확인해 드릴게요. 최근 주문 내역을 조회했어요.','bot'),300);
  setTimeout(()=>addNode(`<div class="act-card">
      <div class="t">주문 조회됨</div>
      <div class="kv"><span>수거일</span><span>26.04.27 (화)</span></div>
      <div class="kv"><span>서비스</span><span>개별클리닝, 생활빨래</span></div>
      <div class="kv"><span>상태</span><span>배송완료 · 04.28</span></div>
    </div>`),900);
  setTimeout(()=>addBubble('이 건이 맞으실까요? 더 궁금한 점이 있으면 편하게 말씀해 주세요.','bot'),1500);
}
// 챗봇 → 1:1 인계: 지금까지의 카테고리 선택값 + 대화 요약을 그대로 들고 넘어감
function escalateToAgent(){
  goZendesk({route:'1:1'});
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),1800);
}

function bind(){
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{
    const d=+r.dataset.d;
    if(d===3){ push({type:'route', d:3, isEtc:true}); return; }
    push({type:'sub', d});
  });
  document.querySelectorAll('.faq-q').forEach(q=>q.onclick=()=>{
    q.closest('.faq').classList.toggle('open');
  });
  document.querySelectorAll('.item').forEach(it=>it.onclick=()=>{
    const di=+it.dataset.d, ii=+it.dataset.i;
    const item=IA[di].items[ii];
    if(item.goToast){ toast(item.goToast); return; }
    if(item.route==='1:1'){ goZendesk(item); return; }
    if(item.nm==='세탁물이 안왔어요') lostInit();
    push({type:'route', d:di, item, isEtc:false});
  });
  document.querySelectorAll('.etc').forEach(b=>b.onclick=()=>push({type:'route', d:+b.dataset.d, isEtc:true}));
  const careBnr=document.querySelector('[data-care-banner]'); if(careBnr) careBnr.onclick=()=>push({type:'care_list'});
  document.querySelectorAll('.care-card').forEach(c=>c.onclick=()=>goZendesk({route:'1:1', priority:'urgent'}));
  document.querySelectorAll('.garment:not(.gmulti)').forEach(g=>g.onclick=()=>selectGarment(+g.dataset.g));
  const gmulti=document.querySelectorAll('.garment.gmulti');
  if(gmulti.length){
    const lf=window._lostFlow;
    window._gsel = (lf&&Array.isArray(lf.gsel))? lf.gsel.slice() : [];
    gmulti.forEach(el=>{
      const i=+el.dataset.gm;
      if(window._gsel.includes(i)) el.classList.add('on');
      el.onclick=()=>{
        el.classList.toggle('on');
        const arr=window._gsel, idx=arr.indexOf(i);
        if(idx>=0) arr.splice(idx,1); else arr.push(i);
      };
    });
  }
  // 분실·누락 폼: 첨부파일 복원
  const al=document.getElementById('attachList'), lfa=lostActive();
  if(al && lfa && lfa.atts.length){ al.innerHTML=''; lfa.atts.forEach(a=>appendAttRow(al, a, lfa)); }
  window._sel=null;
  document.querySelectorAll('.rec[data-rec]').forEach(r=>r.onclick=()=>{
    const t=stack[stack.length-1], sel=+r.dataset.rec;
    // 자동 진행 항목(분실·누락 / 소지품 / 타인 세탁물): 수거건 선택 즉시 다음 단계로
    if(t.type==='route' && !t.escalated && t.item && AUTO_REC.includes(t.item.nm) && (t.step||1)===1){
      if(t.item.nm==='세탁물이 안왔어요' && window._lostFlow){ if(window._lostFlow.sel!==sel) window._lostFlow.gsel=[]; window._lostFlow.sel=sel; }
      window._sel=sel;
      push({type:'route', d:t.d, item:t.item, isEtc:false, step:2, sel});
      return;
    }
    document.querySelectorAll('.rec').forEach(x=>x.classList.remove('sel')); r.classList.add('sel');
    window._sel=sel;
    const nb=document.getElementById('next1to1');
    if(nb){nb.disabled=false; nb.style.opacity='1'; nb.style.pointerEvents='auto'; nb.onclick=next1to1;}
  });
}
render();
</script>
