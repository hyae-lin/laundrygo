:root {

<style>
  html, body { height: 100%; }
  body { background: var(--cool-gray-200); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
  #stage { display: flex; align-items: center; justify-content: center; }
  #phone {
    width: 375px; height: 812px; background: var(--white); border-radius: 44px;
    box-shadow: 0 24px 70px rgba(33,33,33,.22), 0 4px 18px rgba(33,33,33,.10);
    overflow: hidden; position: relative; transform-origin: center center;
    display: flex; flex-direction: column;
    --x-green: #0F6E56; --x-green-press: #0B5743; --x-mint: #1D9E75;
    --x-sel: #E1F5EE; --x-sel-line: #1D9E75; --x-blue: #1668E3;
    --x-blue-soft: #EAF2FE; --x-blue-line: #BBD6FB;
  }
  #root { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  #scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  #scroll::-webkit-scrollbar { width: 0; height: 0; }
  #scroll { scrollbar-width: none; }
  .strike { position: relative; }
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="root"></div>
  </div>
</div>
<script>
  function fitPhone() {
    const phone = document.getElementById('phone');
    const PH = 812, PW = 375, margin = 24;
    const s = Math.min(1, (window.innerHeight - margin) / PH, (window.innerWidth - margin) / PW);
    phone.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitPhone);
  fitPhone();
  const _fit = setInterval(fitPhone, 200);
  setTimeout(() => clearInterval(_fit), 3000);
</script>
<script type="text/babel">

  return (
    <span
      style={{ display: "inline-flex", width: size, height: size, lineHeight: 0, ...style }}
      dangerouslySetInnerHTML={{ __html: window.ldsIcon(name, { size }) }}
    />
  );
}

/* ---------- Button ----------------------------------------------------- */

          <div style={{ fontFamily: FONT, fontWeight: 700, fontSize: 14, color: "var(--fg-1)" }}>개별클리닝</div>
          <div style={{ marginTop: 2, fontFamily: FONT, fontSize: 11.5, fontWeight: 500, color: "var(--gray-700)" }}>케어라벨에 맞춰 한벌씩 세탁해요</div>
          <div style={{ marginTop: 10, border: "1px solid var(--gray-300)", borderRadius: 12, overflow: "hidden" }}>
            {/* 헤더 */}
            <div style={{ display: "flex", padding: "8px 0", background: "var(--gray-100)", borderBottom: "1px solid var(--gray-300)" }}>
              <span style={{ width: 56, flex: "none", paddingLeft: 14, fontFamily: FONT, fontSize: 10.5, fontWeight: 600, color: "var(--fg-2)" }}>종류</span>
              <span style={{ width: 54, flex: "none", paddingLeft: 13, fontFamily: FONT, fontSize: 10.5, fontWeight: 600, color: "var(--fg-2)" }}>세탁권</span>
              <span style={{ flex: 1, paddingRight: 14, fontFamily: FONT, fontSize: 10.5, fontWeight: 600, color: "var(--fg-2)" }}>품목</span>
            </div>
            {/* 종류별 그룹 — 접힘: 대표 1행, 펼침: 전체 단계 */}
            {CARE_GROUPS.map((grp, gi) => {
              const tiers = expand ? grp.tiers : [grp.tiers[grp.def]];
              return (
                <div key={grp.type} style={{ display: "flex", borderTop: gi === 0 ? "none" : "1px solid var(--gray-300)" }}>
                  <div style={{ width: 56, flex: "none", display: "flex", alignItems: "center", paddingLeft: 14, borderRight: "1px solid var(--gray-200)", fontFamily: FONT, fontWeight: 700, fontSize: 13, color: "var(--fg-1)" }}>{grp.type}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    {tiers.map((t, ti) => (
                      <div key={t.n} style={{ display: "flex", alignItems: "center", padding: "11px 0", borderTop: ti === 0 ? "none" : "1px solid var(--gray-200)" }}>
                        <span style={{ width: 54, flex: "none", paddingLeft: 13, fontFamily: FONT, fontWeight: 700, fontSize: 13, color: "var(--x-green)", whiteSpace: "nowrap" }}>{t.n}장</span>
                        <span style={{ flex: 1, paddingRight: 14, fontFamily: FONT, fontSize: 11.5, fontWeight: 500, color: "var(--gray-700)", lineHeight: 1.4 }}>{t.items}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
            <button onClick={() => setExpand(!expand)} style={{ width: "100%", padding: "10px 0", border: "none", borderTop: "1px solid var(--gray-300)", background: "var(--gray-100)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 3, fontFamily: FONT, fontWeight: 600, fontSize: 12, color: "var(--fg-2)" }}>
              {expand ? "접기" : "자세히보기"}
              <Icon name={expand ? "chevron-up" : "chevron-down"} size={15} />
            </button>
          </div>

          {/* 생활빨래 */}
          <div style={{ marginTop: 20, fontFamily: FONT, fontWeight: 700, fontSize: 14, color: "var(--fg-1)" }}>생활빨래</div>
          <div style={{ marginTop: 2, fontFamily: FONT, fontSize: 11.5, fontWeight: 500, color: "var(--gray-700)" }}>서비스 설명 문구</div>
          <div style={{ marginTop: 10, border: "1px solid var(--gray-300)", borderRadius: 12, padding: "12px 13px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontFamily: FONT, fontWeight: 700, fontSize: 13, color: "var(--fg-1)" }}>무게 기준 차감</div>
              <div style={{ marginTop: 2, fontFamily: FONT, fontSize: 11.5, fontWeight: 500, color: "var(--gray-700)" }}>초과 시 0.5kg당 1,200원</div>
            </div>
            <span style={{ flex: "none", fontFamily: FONT, fontWeight: 700, fontSize: 13, color: "var(--x-green)", whiteSpace: "nowrap" }}>4kg 2장</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------- screen */
function App() {
  const [grade, setGrade] = useState(() => localStorage.getItem("lgx_grade_v3") || "standard");
  const [period, setPeriod] = useState(() => localStorage.getItem("lgx_period_v3") || "m3");

  useEffect(() => {localStorage.setItem("lgx_grade_v3", grade);}, [grade]);
  useEffect(() => {localStorage.setItem("lgx_period_v3", period);}, [period]);

  const [sheet, setSheet] = useState(false);
  const [expand, setExpand] = useState(false);

  const { g, p, monthly, savings, annual } = calc(grade, period);
  const isRec = grade === REC.grade && period === REC.period;
  const ticketsOk = g.tickets >= REQUIRED;
  const shipOk = g.ship >= PICKUPS;
  const shipOver = PICKUPS - g.ship;
  const next = BENEFITS.find((b) => b.from > p.months);

  const benefitRows = [
  { label: "월 절약 금액", value: fmt(savings) + "원", sub: "연간 " + fmt(annual) + "원", tone: "save" },
  { label: "월 구독 비용", value: fmt(monthly) + "원", sub: p.disc > 0 ? p.name + " " + pct(p.disc) + "% 할인" : "할인 미적용" },
  { label: "세탁권", value: ticketsOk ? "충족" : "부족", sub: ticketsOk ? "필요 월 9.3장" : "필요 월 9.3장 · 초과분 개별 과금", tone: ticketsOk ? "save" : "warn", check: ticketsOk },
  { label: "무료배송권", value: shipOk ? "충족" : "월 " + shipOver.toFixed(1) + "회 초과", sub: shipOk ? "수거 월 " + PICKUPS + "회" : "수거 월 " + PICKUPS + "회 · 초과분 회당 " + fmt(SHIP_OVER) + "원", tone: shipOk ? "save" : "warn", check: shipOk }];


  const cardBox = { background: "var(--white)", border: "1px solid var(--gray-300)", borderRadius: 12, overflow: "hidden" };

  return (
    <React.Fragment>
      <StatusBar />
      <TopAppBar title="플랜 추천 결과" center border
      onBack={() => {}}
      right={<span style={{ width: 22, display: "inline-block" }} />} />

      <div id="scroll">
        {/* 1. 최근 이용 분석 (사용량) */}
        <Section title="최근 6건 이용 분석">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
            <StatCell label="월 개별클리닝" value="8.3" unit="건" hero />
            <StatCell label="월 생활빨래" value="이용 없음" muted />
            <StatCell label="월 수거 횟수" value="1.7" unit="회" />
            <StatCell label="월 세탁비 지출" value="97,400" unit="원" />
          </div>
        </Section>

        {/* 2. 결과 안내 인트로 (세탁권 개념·환산) */}
        <section style={{ padding: "0 var(--gutter)", marginTop: 18 }}>
          <p style={{ margin: 0, fontFamily: FONT, fontWeight: 600, fontSize: 14, lineHeight: 1.5, letterSpacing: "-.01em", color: "var(--fg-1)" }}>
            고객님의 세탁 패턴을 <b style={{ fontWeight: 700, color: "var(--x-green)" }}>세탁권</b>으로 환산해<br />가장 혜택이 큰 플랜을 추천드려요.
          </p>
          <ul style={{ margin: "8px 0 0", padding: 0, listStyle: "none", display: "grid", gap: 4 }}>
            {[
              <React.Fragment><b style={{ fontWeight: 700, color: "var(--fg-2)" }}>‘세탁권’</b>은 구독 시 지급돼 세탁할 때 쓰는 이용권이에요.</React.Fragment>,
              "필요한 세탁권 장수는 세탁 품목에 따라 달라져요.",
            ].map((t, i) => (
              <li key={i} style={{ display: "flex", gap: 6, fontFamily: FONT, fontSize: 11.5, lineHeight: 1.5, fontWeight: 500, color: "var(--gray-700)" }}>
                <span style={{ flex: "none", color: "var(--cool-gray-500)" }}>·</span>
                <span>{t}</span>
              </li>
            ))}
          </ul>
        </section>

        {/* 3. AI 추천 (옅은 블루, 컴팩트) */}
        <section style={{ padding: "0 var(--gutter)", marginTop: 14 }}>
          <div style={{ background: "var(--x-blue-soft)", border: "1px solid var(--x-blue-line)", borderRadius: 12, padding: "13px 15px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ fontFamily: FONT, fontWeight: 700, fontSize: 9.5, color: "#fff", background: "var(--x-blue)", borderRadius: 4, padding: "2px 6px" }}>AI 추천</span>
              <span style={{ fontFamily: FONT, fontWeight: 700, fontSize: 14, color: "var(--fg-1)", letterSpacing: "-.01em" }}>런드리고X 스탠다드</span>
            </div>
            <div style={{ marginTop: 8, display: "grid", gap: 6 }}>
              {[
                <React.Fragment>의류·이불·신발까지 맡기는 분께 딱 맞는 요금제예요.</React.Fragment>,
                <React.Fragment>세탁 패턴 세탁권 환산 시 <b style={{ fontWeight: 700, color: "var(--fg-1)" }}>9.3장</b> 필요, 스탠다드 <b style={{ fontWeight: 700, color: "var(--x-green)" }}>충족</b></React.Fragment>,
              ].map((t, i) => (
                <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 6 }}>
                  <span style={{ width: 15, height: 15, flex: "none", marginTop: 1, borderRadius: 999, background: "var(--x-green)", color: "#fff", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                    <Icon name="check" size={10} />
                  </span>
                  <span style={{ fontFamily: FONT, fontSize: 12, fontWeight: 500, lineHeight: 1.45, color: "var(--cool-gray-700)" }}>{t}</span>
                </div>
              ))}
            </div>
            <button onClick={() => setSheet(true)} style={{
              marginTop: 9, padding: 0, cursor: "pointer",
              background: "none", border: "none",
              display: "inline-flex", alignItems: "center", gap: 1,
              fontFamily: FONT, fontWeight: 500, fontSize: 11.5, color: "var(--cool-gray-700)",
            }}>
              맡길 수 있는 품목 알아보기
              <Icon name="chevron-right" size={13} />
            </button>
          </div>
        </section>

        {/* 3. 선택한 플랜 혜택 — 4행 리스트 */}
        <Section title="선택한 플랜 혜택">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
            {benefitRows.map((r) =>
            <MetricCell key={r.label} {...r} />
            )}
          </div>
        </Section>

        {/* 4. 등급 변경 */}
        <Section title="등급 변경">
          <div style={{ display: "flex", gap: 6 }}>
            {GRADES.map((gr) =>
            <GradeCard key={gr.key} g={gr} selected={grade === gr.key} onSelect={() => setGrade(gr.key)} />
            )}
          </div>
        </Section>

        {/* 5. 구독 기간 선택 */}
        <Section title="구독 기간 선택">
          {PERIODS.map((pr) => {
            const c = calc(grade, pr.key);
            return (
              <PeriodRow key={pr.key} p={pr} base={g.base} monthly={c.monthly} total={c.total}
              selected={period === pr.key} onSelect={() => setPeriod(pr.key)} />);

          })}

          {/* 6. 포함 혜택 (누적) */}
          <div style={{ marginTop: 12, background: "var(--gray-100)", border: "1px solid var(--gray-200)", borderRadius: 12, padding: "12px 14px 11px" }}>
            <div style={{ fontFamily: FONT, fontWeight: 700, fontSize: 12.5, color: "var(--fg-1)" }}>포함 혜택</div>
            <div style={{ marginTop: 4 }}>
              {BENEFITS.map((b) =>
              <BenefitItem key={b.label} label={b.label} from={b.from} unlocked={p.months >= b.from} />
              )}
            </div>
            <div style={{ marginTop: 7, padding: "8px 11px", background: "var(--white)", borderRadius: 9, display: "flex", alignItems: "center", gap: 7 }}>
              <span style={{ width: 15, height: 15, flex: "none", borderRadius: 999, background: next ? "var(--x-blue)" : "var(--x-green)", color: "#fff", display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, fontFamily: FONT }}>
                {next ? "+" : "✓"}
              </span>
              <span style={{ fontFamily: FONT, fontSize: 11.5, fontWeight: 500, color: "var(--cool-gray-700)" }}>
                {next ?
                <React.Fragment><b style={{ color: "var(--x-blue)", fontWeight: 700 }}>{next.from}개월</b>부터 <b style={{ fontWeight: 700, color: "var(--fg-1)" }}>{next.label}</b> 혜택이 제공돼요.</React.Fragment> :
                "제공되는 모든 구독 혜택을 받고 있어요."}
              </span>
            </div>
          </div>
        </Section>

        {/* 7. 안내 문구 */}
        <p style={{ padding: "0 var(--gutter)", margin: "12px 0 0", fontFamily: FONT, fontSize: 10.5, lineHeight: 1.5, color: "var(--gray-700)" }}>
          * 이용 종료 후에는 월 구독 가격으로 매월 자동 갱신됩니다.
        </p>
        <div style={{ height: 18 }} />
      </div>

      {/* 8. 하단 고정 CTA */}
      <div style={{ flex: "none", background: "var(--white)", boxShadow: "var(--shadow-cta)", padding: "9px var(--gutter) 12px" }}>
        <button onClick={() => {}} style={{
          width: "100%", height: 50, border: "none", borderRadius: 14, cursor: "pointer",
          background: "var(--x-green)", color: "#fff", fontFamily: FONT, fontWeight: 700, fontSize: 15,
          display: "flex", alignItems: "center", justifyContent: "center",
          transition: "filter .12s"
        }}
        onMouseDown={(e) => e.currentTarget.style.filter = "brightness(.93)"}
        onMouseUp={(e) => e.currentTarget.style.filter = "none"}
        onMouseLeave={(e) => e.currentTarget.style.filter = "none"}>
          {g.name} · 월 {fmt(monthly)}원 구독하기
        </button>
      </div>
      {/* 품목 상세 바텀시트 */}
      <ProductSheet open={sheet} onClose={() => setSheet(false)} expand={expand} setExpand={setExpand} />
    </React.Fragment>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
